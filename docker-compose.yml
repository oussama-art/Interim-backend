
name: interim-platform

services:

  # =========================
  # PostgreSQL – Keycloak
  # =========================
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: interim-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # PostgreSQL – Backend
  # =========================
  postgres-backend:
    image: postgres:16-alpine
    container_name: interim-postgres-backend
    restart: unless-stopped
    ports:
      - "5432:5432"   # ← pour pgAdmin
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASS}
    volumes:
      - pgdata_backend:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interimuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Keycloak
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: interim-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}


      KC_SPI_IMPORT_STRATEGY: IGNORE_EXISTING
    volumes:
      - ./Keycloak/realms:/opt/keycloak/data/import
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - backend

  # =========================
  # Spring Boot Backend
  # =========================
  backend:
    build:
      context: ./NService
      dockerfile: Dockerfile
    container_name: interim-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./NService/uploads:/app/uploads
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  # =========================
  # pgAdmin (PostgreSQL UI)
  # =========================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: interim-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - backend


networks:
  backend:
    driver: bridge




volumes:
  pgdata_keycloak:
  pgdata_backend:
